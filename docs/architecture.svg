<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 570" width="1210" height="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box   { fill: #161b22; stroke-width: 2; }
      .title { fill: #e6edf3; font-size: 15px; font-weight: 600; }
      .sub   { fill: #8b949e; font-size: 12px; }
      .flow  { stroke: #8b949e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .lane  { fill: #0d1117; stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
      .lanel { fill: #6e7681; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; }
      .label { fill: #8b949e; font-size: 11px; font-style: italic; }
    </style>
  </defs>

  <rect width="1210" height="570" rx="14" fill="#0d1117"/>
  <text x="30" y="38" fill="#e6edf3" font-size="20" font-weight="700">Video Dubbing — Architecture</text>
  <text x="30" y="58" fill="#8b949e" font-size="13">English video → Uzbek dubbed video</text>

  <!-- Lanes -->
  <rect class="lane" x="380" y="60" width="815" height="142" rx="10"/>
  <text class="lanel" x="392" y="78">SPEECH PATH</text>
  <rect class="lane" x="380" y="316" width="815" height="114" rx="10"/>
  <text class="lanel" x="392" y="332">BACKGROUND &amp; ASSEMBLY</text>

  <!-- Input -->
  <rect class="box" stroke="#8b949e" x="30" y="217" width="140" height="80" rx="10"/>
  <text class="title" x="100" y="252" text-anchor="middle">Input video</text>
  <text class="sub" x="100" y="272" text-anchor="middle">.mp4 (English)</text>

  <rect class="box" stroke="#8b949e" x="200" y="217" width="160" height="80" rx="10"/>
  <text class="title" x="280" y="252" text-anchor="middle">Audio extraction</text>
  <text class="sub" x="280" y="272" text-anchor="middle">moviepy · 44.1 kHz</text>

  <!-- Speech path -->
  <rect class="box" stroke="#58a6ff" x="390" y="88" width="190" height="100" rx="10"/>
  <text class="title" x="485" y="118" text-anchor="middle">Speaker analysis</text>
  <text class="sub" x="485" y="140" text-anchor="middle">pyannote diarization</text>
  <text class="sub" x="485" y="157" text-anchor="middle">wav2vec2 gender</text>
  <text class="sub" x="485" y="174" text-anchor="middle">faster-whisper STT</text>

  <rect class="box" stroke="#d2a8ff" x="610" y="88" width="170" height="100" rx="10"/>
  <text class="title" x="695" y="118" text-anchor="middle">Translation</text>
  <text class="sub" x="695" y="140" text-anchor="middle">OpenAI GPT-4o</text>
  <text class="sub" x="695" y="157" text-anchor="middle">duration-aware</text>
  <text class="sub" x="695" y="174" text-anchor="middle">batched with context</text>

  <rect class="box" stroke="#3fb950" x="810" y="88" width="170" height="100" rx="10"/>
  <text class="title" x="895" y="118" text-anchor="middle">Voice-cloning TTS</text>
  <text class="sub" x="895" y="140" text-anchor="middle">DiT + Vocos (Uzbek)</text>
  <text class="sub" x="895" y="157" text-anchor="middle">male / female</text>
  <text class="sub" x="895" y="174" text-anchor="middle">reference voices</text>

  <rect class="box" stroke="#f0883e" x="1010" y="88" width="170" height="100" rx="10"/>
  <text class="title" x="1095" y="118" text-anchor="middle">Time alignment</text>
  <text class="sub" x="1095" y="140" text-anchor="middle">Silero VAD</text>
  <text class="sub" x="1095" y="157" text-anchor="middle">rubberband stretch</text>
  <text class="sub" x="1095" y="174" text-anchor="middle">RMS normalize · fade</text>

  <!-- Background & assembly -->
  <rect class="box" stroke="#db61a2" x="390" y="340" width="190" height="76" rx="10"/>
  <text class="title" x="485" y="372" text-anchor="middle">Source separation</text>
  <text class="sub" x="485" y="394" text-anchor="middle">Demucs htdemucs</text>

  <rect class="box" stroke="#f0883e" x="1010" y="340" width="170" height="76" rx="10"/>
  <text class="title" x="1095" y="372" text-anchor="middle">Mix</text>
  <text class="sub" x="1095" y="394" text-anchor="middle">voice + background</text>

  <rect class="box" stroke="#8b949e" x="1010" y="462" width="170" height="80" rx="10"/>
  <text class="title" x="1095" y="496" text-anchor="middle">Dubbed video</text>
  <text class="sub" x="1095" y="516" text-anchor="middle">MP4 + metadata.json</text>

  <!-- Flows -->
  <path class="flow" d="M170,257 H196"/>
  <path class="flow" d="M360,257 H368 V138 H386"/>
  <path class="flow" d="M368,257 V378 H386"/>
  <path class="flow" d="M580,138 H606"/>
  <path class="flow" d="M780,138 H806"/>
  <path class="flow" d="M980,138 H1006"/>
  <path class="flow" d="M1095,188 V336"/>
  <text class="label" x="1103" y="262">aligned segments</text>
  <path class="flow" d="M580,378 H1006"/>
  <text class="label" x="795" y="370" text-anchor="middle">no_vocals stem (music + effects)</text>
  <path class="flow" d="M1095,416 V458"/>
  <text class="label" x="1103" y="442">mux (ffmpeg)</text>
  <path class="flow" d="M100,297 V502 H1006" stroke-dasharray="6 5"/>
  <text class="label" x="555" y="494" text-anchor="middle">original video stream</text>

  <!-- Segment legend -->
  <text class="sub" x="130" y="352">Each segment carries:</text>
  <text class="sub" x="130" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">id · speaker · gender</text>
  <text class="sub" x="130" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">start · end · text</text>
  <text class="sub" x="130" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">overlap · tts/aligned path</text>
</svg>
